<style>
/* Mise en page : colonne unique pour téléphone. En-tête, zone de travail défilante, barre de panier, navigation du bas.
   Les actions (panier, paiement, ticket, produit) s'ouvrent dans un panneau qui monte du bas. */
:root{
  --bg:#F6F7FC; --surface:#FFFFFF; --surface-2:#ECEFF6; --fg:#1B1F2A; --muted:#667085; --line:#E2E6F0;
  --accent-base:#055548; --accent:var(--accent-base); --accent-fg:#FFFFFF; --accent-soft:color-mix(in srgb,var(--accent-base) 14%,var(--surface));
  --danger:#B3261E; --danger-soft:#FBE4E1; --ok:#157347; --warn:#8A5A00; --warn-soft:#FBEFD3;
  --paper:#FFFFFF; --ink:#1A1A1A;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --surface:#16201D; --surface-2:#212F2B; --fg:#E8F0ED; --muted:#93A59E; --line:#2A3834;
    --accent:color-mix(in srgb,var(--accent-base) 55%,#fff); --accent-fg:#0B1210; --accent-soft:color-mix(in srgb,var(--accent-base) 30%,var(--surface));
    --danger:#FF8A80; --danger-soft:#3A1E1C; --ok:#6FD6A0; --warn:#F2C26B; --warn-soft:#3A2F14;
    --paper:#EDEFEE; --ink:#16201D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201D; --surface-2:#212F2B; --fg:#E8F0ED; --muted:#93A59E; --line:#2A3834;
  --accent:color-mix(in srgb,var(--accent-base) 55%,#fff); --accent-fg:#0B1210; --accent-soft:color-mix(in srgb,var(--accent-base) 30%,var(--surface));
  --danger:#FF8A80; --danger-soft:#3A1E1C; --ok:#6FD6A0; --warn:#F2C26B; --warn-soft:#3A2F14;
  --paper:#EDEFEE; --ink:#16201D;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head h1{font:700 20px/1.15 var(--font-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.date{color:var(--muted);font-size:13px;text-transform:capitalize}
.badge{flex:none;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;flex-shrink:0;padding-bottom:2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:4px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:94px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tile:active{transform:scale(.98)}
.tile:disabled{opacity:.5}
.tile .nm{font-weight:500;overflow-wrap:anywhere;padding-right:24px}
.tile .pr{font:600 17px var(--font-display);font-variant-numeric:tabular-nums}
.tile .st{font-size:12px;color:var(--muted)}
.tile .st.low{color:var(--warn);font-weight:600}
.tile .qty{position:absolute;top:8px;right:8px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font:600 13px/24px var(--font-display);text-align:center}
.empty{padding:26px 14px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--fg);font:600 17px var(--font-display)}
.cartbar{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 18px;border-radius:16px;background:var(--accent);color:var(--accent-fg);font-weight:600}
.cartbar:disabled{background:var(--surface-2);color:var(--muted)}
.cartbar .t{font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.nav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:3px;background:var(--surface-2);border-radius:14px}
.nav button{padding:10px 2px;border-radius:11px;text-align:center;font-size:12.5px;font-weight:500;color:var(--muted)}
.nav button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--surface-2);border-radius:12px}
.seg button{padding:10px 6px;border-radius:9px;text-align:center;font-weight:500;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.backdrop{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,12,10,.5)}

</head><body>
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ====== Formats ====== */
const fmt=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const money=c=>fmt.format(c/100);
const hm=new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'});
const dtf=new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const dayFmt=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCents(s){const v=parseFloat(String(s).replace(/[\s€ ]/g,'').replace(',','.'));return isFinite(v)?Math.round(v*100):NaN}
const toInput=c=>(c/100).toFixed(2).replace('.',',');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const pctTxt=v=>String(v).replace('.',',');
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const pad6=n=>String(n).padStart(6,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const METHODS={cash:'Espèces',card:'Carte bancaire',tr:'Titres-restaurant',chq:'Chèque',voucher:'Bon d\'achat / avoir'};
const SHORTM={cash:'Espèces',card:'Carte',tr:'Titres-resto',chq:'Chèque',voucher:'Bon d\'achat'};
const RATES=[20,10,5.5,2.1,0];
const TAB=uid();

/* ====== Stockage : base partagée de l'artifact, ou cet appareil en secours ====== */
let db=null,downloads=null,demo=false;
const LKEY='caisse-boutique-pro-v1';
const clone=o=>JSON.parse(JSON.stringify(o));
const L={data:{},subs:{}},D={data:{},subs:{}};
const loc=()=>demo?D:L;
function lload(){try{L.data=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}}catch(e){L.data={}}}
function lsave(){if(demo)return;try{localStorage.setItem(LKEY,JSON.stringify(L.data))}catch(e){}}
function lnotify(col){const o=loc();(o.subs[col]||[]).forEach(cb=>cb(clone(o.data[col]||{}),false))}
const offs=[];
const useDb=()=>db&&!demo;
const Store={
  sub(col,cb){
    if(useDb()){offs.push(db.collection(col).onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=clone(d.data())});cb(m,s.metadata.fromCache)},e=>cb(null,false,e)));return}
    const o=loc();(o.subs[col]=o.subs[col]||[]).push(cb);setTimeout(()=>lnotify(col),0);
    offs.push(()=>{o.subs[col]=(o.subs[col]||[]).filter(x=>x!==cb)});
  },
  stop(){offs.splice(0).forEach(f=>{try{f()}catch(e){}})},
  async set(col,id,data){if(useDb())return db.doc(col+'/'+id).set(data);const o=loc();(o.data[col]=o.data[col]||{})[id]=clone(data);lsave();lnotify(col)},
  async update(col,id,data){if(useDb())return db.doc(col+'/'+id).update(data);const o=loc();const c=(o.data[col]=o.data[col]||{});c[id]=Object.assign({},c[id]||{},clone(data));lsave();lnotify(col)},
  async del(col,id){if(useDb())return db.doc(col+'/'+id).delete();const o=loc();if(o.data[col])delete o.data[col][id];lsave();lnotify(col)},
  async lease(){if(useDb()){const r=await db.doc('meta/counter').acquire({holder:TAB,ttlMs:4000});return r.acquired}return true}
};

/* ====== État ====== */
const COLS={config:'cfg',products:'products',sales:'sales',closures:'closures',meta:'counter',staff:'staff',holds:'holds',moves:'moves',customers:'customers',vouchers:'vouchers',orders:'orders'};
function freshState(){return{cfg:null,products:{},sales:{},closures:{},counter:{},staff:{},holds:{},moves:{},customers:{},vouchers:{},orders:{},
  ready:{config:false,products:false,sales:false,closures:false,meta:false,staff:false,holds:false,moves:false,customers:false,vouchers:false,orders:false},slow:false,dbError:false}}
let S=freshState();
const ui={tab:'sale',cat:'Tout',q:'',cart:[],discount:null,sheet:null,pay:null,done:null,view:null,editing:null,setup:null,disc:null,refund:null,
  area:null,cust:null,cs:'login',cb:{},ccat:'Tout',orderId:null,zCounted:'',zFloat:'',mode:'items',kp:'',kpVat:20,busy:false,chain:null,showArchived:false,user:null,ob:null,pIcon:'',pinSel:null,pinBuf:'',pinErr:'',period:'day',by:'all',weigh:null,imp:null,move:null,spage:null,client:null,clientQ:'',clientEdit:null,tq:'',pImg:'',free:null};
const allReady=()=>Object.values(S.ready).every(Boolean);
const franchise=()=>true;
const salesList=()=>Object.values(S.sales).sort((a,b)=>a.n-b.n);
const prodList=()=>Object.values(S.products).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
const activeProds=()=>prodList().filter(p=>p.active!==false);
const cats=()=>[...new Set(activeProds().map(p=>p.cat||'Divers'))].sort((a,b)=>a.localeCompare(b,'fr'));
const effRate=p=>franchise()?0:(typeof p.vat==='number'?p.vat:20);
const alertOf=p=>typeof p.alert==='number'?p.alert:3;
const staffList=()=>Object.values(S.staff).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
const locked=()=>staffList().length>0&&!ui.user;
const isAdmin=()=>!staffList().length||(ui.user&&ui.user.role==='admin');
const who=()=>ui.user?ui.user.name:'';
const openMoves=()=>Object.values(S.moves).filter(m=>(m.after||0)===(S.counter.lastClosedN||0)).sort((a,b)=>a.ts-b.ts);
const DEF={ticket:{auto:'show',width:38,seller:true,vat:true,logo:'',showLogo:true,header:'',client:true},methods:['cash','card','tr','chq','voucher'],discounts:[5,10,15,20,30],loyalty:{on:false,perEuro:1,redeemPts:100,redeemEur:5},fields:[],tiles:'images'};
function cf(path){let v=S.cfg||{},d=DEF;for(const k of path.split('.')){v=v==null?undefined:v[k];d=d==null?undefined:d[k]}
  if(v===undefined)return d;
  if(v&&d&&typeof v==='object'&&typeof d==='object'&&!Array.isArray(v)&&!Array.isArray(d))return Object.assign({},d,v);
  return v}
const enabledM=k=>k==='cash'||cf('methods').indexOf(k)>=0;
const payMethods=()=>Object.keys(METHODS).filter(enabledM);
const custList=()=>Object.values(S.customers).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
const curClient=()=>ui.client?S.customers[ui.client]||null:null;
async function pinHash(id,pin){const h=await sha('pin:'+id+':'+pin);return h||('plain:'+pin)}

/* ====== Calculs (TVA, remises) ====== */
function calc(lines,disc){
  const sub=lines.reduce((a,l)=>a+l.price*l.qty,0);
  let d=disc||0;
  if(sub>0)d=Math.max(0,Math.min(d,sub));
  const alloc=[];let rem=d;
  lines.forEach((l,i)=>{const amt=l.price*l.qty;const a=i===lines.length-1?rem:Math.round(sub?d*amt/sub:0);alloc.push(amt-a);rem-=a});
  const g={};
  lines.forEach((l,i)=>{const r=l.vat||0;g[r]=(g[r]||0)+alloc[i]});
  const vat=Object.keys(g).map(Number).sort((a,b)=>b-a).map(r=>{const ttc=g[r];const ht=Math.round(ttc/(1+r/100));return{rate:r,ttc,ht,tva:ttc-ht}});
  return{sub,disc:d,total:sub-d,vat};
}
function cartLines(){
  return ui.cart.map(l=>{
    if(l.free)return{id:'free',lk:'free|'+l.k,k:l.k,name:l.name,price:l.price,qty:l.qty,vat:franchise()?0:l.vat,sku:'',buy:null,w:0,free:true,gift:!!l.gift};
    const p=S.products[l.id];if(!p)return null;const r=effRate(p);
    const buy=typeof p.buy==='number'?p.buy:null;
    if(l.w)return{id:p.id,lk:p.id+'|'+l.k,k:l.k,name:p.name+' '+String(l.w).replace('.',',')+' kg',price:Math.round(p.price*l.w),qty:1,vat:r,sku:p.sku||'',buy:buy===null?null:Math.round(buy*l.w),w:l.w};
    return{id:p.id,lk:p.id,k:'',name:p.name,price:p.price,qty:l.qty,vat:r,sku:p.sku||'',buy,w:0};
  }).filter(Boolean);
}
function cartTotals(){
  const lines=cartLines();const sub=lines.reduce((a,l)=>a+l.price*l.qty,0);
  let disc=0;const d=ui.discount;
  if(d)disc=d.type==='pct'?Math.round(sub*d.value/100):d.value;
  const c=calc(lines,disc);
  return Object.assign({lines,count:lines.reduce((a,l)=>a+l.qty,0)},c);
}
const paidSum=p=>p.payments.reduce((a,x)=>a+x.amount,0);
const lineKey=l=>l.lk||l.id;

/* ====== Empreintes (chaînage des tickets) ====== */
function canon(v){
  if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
  return JSON.stringify(v);
}
async function sha(text){
  try{
    if(!(window.crypto&&crypto.subtle))return '';
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){return ''}
}
const saleCore=s=>{const o={n:s.n,ts:s.ts,kind:s.kind,refOf:s.refOf||0,lines:s.lines,sub:s.sub,disc:s.disc,total:s.total,vat:s.vat,payments:s.payments,change:s.change,prev:s.prev};if(s.by)o.by=s.by;if(s.client)o.client=s.client;return o};
const zCore=z=>({n:z.n,ts:z.ts,fromN:z.fromN,toN:z.toN,t:z.t,float:z.float,counted:z.counted,prev:z.prev});
async function verifyChain(){
  const sales=salesList();let prev='GENESIS',bad=[],missing=[],expect=1;
  for(const s of sales){
    if(s.n!==expect){for(let k=expect;k<s.n;k++)missing.push(k)}
    expect=s.n+1;
    const h=await sha(s.prev+'|'+canon(saleCore(s)));
    if(s.prev!==prev&&prev!=='GENESIS'&&sales.indexOf(s)>0)bad.push(s.n);
    else if(h&&h!==s.hash)bad.push(s.n);
    prev=s.hash;
  }
  const zs=Object.values(S.closures).sort((a,b)=>a.n-b.n);let zp='GENESIS',zbad=[];
  for(const z of zs){const h=await sha(z.prev+'|'+canon(zCore(z)));if(z.prev!==zp||(h&&h!==z.hash))zbad.push(z.n);zp=z.hash}
  return{count:sales.length,bad,missing,zcount:zs.length,zbad,hashing:!!(window.crypto&&crypto.subtle)};
}


/* ====== Tickets en texte ====== */
let W=38;
const padR=(s,w)=>{s=String(s);return s.length>=w?s.slice(0,w):s+' '.repeat(w-s.length)};
const padL=(s,w)=>{s=String(s);return s.length>=w?s:' '.repeat(w-s.length)+s};
const lr=(a,b)=>{a=String(a);b=String(b);const sp=W-a.length-b.length;return sp>=1?a+' '.repeat(sp)+b:a.slice(0,Math.max(0,W-b.length-1))+' '+b};
const ctr=s=>{s=String(s);return s.length>=W?s:' '.repeat(Math.floor((W-s.length)/2))+s};
const eur=c=>money(c).replace(/ /g,' ').replace(/ /g,' ');
const rule=ch=>(ch||'-').repeat(W);
function wrap(text,w){const out=[];String(text||'').split('\n').forEach(par=>{let line='';par.split(/\s+/).filter(Boolean).forEach(word=>{if((line+' '+word).trim().length>w){if(line)out.push(line);line=word}else line=(line+' '+word).trim()});if(line)out.push(line)});return out}
function shopHeader(){
  const c=S.cfg||{};const o=[];W=cf('ticket.width')||38;
  if(demo){o.push(ctr('*** MODE FORMATION ***'));o.push('')}
  o.push(ctr((c.name||'').toUpperCase().slice(0,W)));
  wrap(c.address,W).forEach(l=>o.push(ctr(l)));
  if(c.phone)o.push(ctr(c.phone));
  if(c.siret)o.push(ctr('SIRET '+c.siret));
  if(c.tvaNum)o.push(ctr('TVA '+c.tvaNum));
  if(cf('ticket.header'))wrap(cf('ticket.header'),W).forEach(l=>o.push(ctr(l)));
  return o;
}
function vatLines(vat){
  if(franchise())return [];
  const o=[padR('Taux',7)+padL('HT',10)+padL('TVA',9)+padL('TTC',12)];
  vat.forEach(v=>o.push(padR(pctTxt(v.rate)+' %',7)+padL(eur(v.ht),10)+padL(eur(v.tva),9)+padL(eur(v.ttc),12)));
  return o;
}
function ticketText(s){
  const o=shopHeader();o.push('');
  o.push(ctr(s.kind==='refund'?'TICKET DE RETOUR':'TICKET DE CAISSE'));
  o.push(lr('N° '+pad6(s.n),dtf.format(new Date(s.ts))));
  if(s.by&&cf('ticket.seller'))o.push('Caissier : '+s.by);
  if(s.client&&cf('ticket.client'))o.push('Client : '+s.client);
  if(s.kind==='refund'){o.push('Retour sur le ticket N° '+pad6(s.refOf));if(s.reason)o.push('Motif : '+s.reason)}
  o.push(rule());
  s.lines.forEach(l=>{
    o.push(lr((Math.abs(l.qty)>1||l.qty<0?l.qty+' x ':'')+l.name,eur(l.price*l.qty)));
    if(Math.abs(l.qty)>1)o.push('   '+eur(l.price)+' l\'unité');
  });
  o.push(rule());
  if(s.disc){o.push(lr('Sous-total',eur(s.sub)));o.push(lr('Remise'+(s.discLabel?' '+s.discLabel:''),eur(-s.disc)))}
  o.push(lr('TOTAL TTC',eur(s.total)));
  o.push(rule());
  if(!franchise()&&cf('ticket.vat')){vatLines(s.vat).forEach(l=>o.push(l));o.push(rule())}
  s.payments.forEach(p=>{o.push(lr((s.kind==='refund'?'Remboursé ':'')+SHORTM[p.m],eur(p.amount)));if(p.code)o.push('   Code : '+p.code)});
  if(s.change>0)o.push(lr('Monnaie rendue',eur(s.change)));
  if(s.pts)o.push(lr('Points fidélité gagnés',s.pts));
  o.push('');
  wrap((S.cfg&&S.cfg.footer)||'',W).forEach(l=>o.push(ctr(l)));
  if(s.hash)o.push(ctr('Empreinte '+s.hash.slice(0,12)));
  return o.join('\n');
}
function expectedCash(z){return z.float+(z.t.pay.cash||0)+(z.t.movesIn||0)-(z.t.movesOut||0)}
function zText(z){
  const o=shopHeader();o.push('');
  o.push(ctr('CLOTURE DE CAISSE  Z N° '+pad6(z.n)));
  o.push(ctr(dtf.format(new Date(z.ts))));
  o.push('Tickets N° '+pad6(z.fromN)+' à '+pad6(z.toN));
  o.push(rule());
  o.push(lr('Ventes ('+z.t.nSales+')',eur(z.t.salesTtc)));
  o.push(lr('Retours ('+z.t.nRefunds+')',eur(z.t.refundsTtc)));
  o.push(lr('Remises accordées',eur(z.t.discounts)));
  o.push(lr('CHIFFRE D\'AFFAIRES TTC',eur(z.t.net)));
  o.push(rule());
  Object.keys(METHODS).filter(k=>enabledM(k)||z.t.pay[k]).forEach(k=>o.push(lr(METHODS[k],eur(z.t.pay[k]||0))));
  o.push(rule());
  o.push(lr('Fond de caisse',eur(z.float)));
  o.push(lr('Entrées d\'espèces',eur(z.t.movesIn||0)));
  o.push(lr('Sorties d\'espèces',z.t.movesOut?eur(-z.t.movesOut):eur(0)));
  o.push(lr('Espèces attendues',eur(expectedCash(z))));
  o.push(lr('Espèces comptées',eur(z.counted)));
  const gap=z.counted-expectedCash(z);
  o.push(lr('Écart',(gap>0?'+':'')+eur(gap)));
  o.push(rule());
  o.push(lr('Cumul ventes depuis le début',eur(z.cumul||0)));
  o.push(ctr('Empreinte '+(z.hash||'').slice(0,12)));
  return o.join('\n');
}

async function commit(build,after){
  if(ui.busy)return;ui.busy=true;renderSheet();
  try{
    const ok=await Store.lease();
    if(!ok){toast('Une autre caisse enregistre un ticket. Réessayez dans un instant.');return}
    const c=S.counter;const prev=c.lastHash||'GENESIS';const n=(c.lastN||0)+1;
    const rec=build(n,prev);
    rec.hash=await sha(prev+'|'+canon(saleCore(rec)));
    await Store.set('sales',pad6(n),rec);
    const nc=Object.assign({},c,{lastN:n,lastHash:rec.hash});
    await Store.set('meta','counter',nc);
    S.counter=nc;S.sales[pad6(n)]=rec;
    try{const r=rec.sub?((rec.disc||0)/rec.sub):0,why=rec.kind==='refund'&&Math.abs(rec.total)>=5000?'Retour de '+money(Math.abs(rec.total)):(r>=.5&&rec.disc>0)?'Remise de '+Math.round(r*100)+' %':(Math.abs(rec.total)>=50000?'Ticket de '+money(rec.total):'');
      if(why&&!demo){const aid='w'+Date.now().toString(36);if(farceSeen)farceSeen.add(aid);Store.set('farces',aid,{id:aid,kind:'alerte',text:why+' · ticket N° '+pad6(n),by:who()||'Caisse',ts:Date.now()}).catch(()=>{})}}catch(e){}
    await after(rec);
  }catch(e){toast('Enregistrement impossible : '+(e&&e.message?e.message:'réessayez.'))}
  finally{ui.busy=false}
}

function parseImport(text){
  const out=[],errs=[];
  text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{
    const c=l.split(/[;\t]/).map(x=>x.trim());
    if(i===0&&/^(nom|name|produit|article)/i.test(c[0]))return;
    const price=parseCents(c[1]);
    if(!c[0]||!(price>=0)){errs.push('ligne '+(i+1));return}
    const vr=c[2]?parseFloat(c[2].replace(',','.')):20;const vat=RATES.indexOf(vr)>=0?vr:20;
    const st=c[5]?parseInt(c[5],10):NaN;const buy=c[6]?parseCents(c[6]):NaN;
    out.push({name:c[0],price,vat,cat:c[3]||'Divers',sku:c[4]||'',stock:st>=0?st:null,buy:buy>=0?buy:null});
  });
  return{out,errs};
}

function imgToData(file,max,type,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=()=>rej(new Error('Lecture du fichier impossible.'));
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Ce fichier n\'est pas une image.'));
      im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc));
        const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
        if(type==='image/jpeg'){g.fillStyle='#fff';g.fillRect(0,0,w,h)}
        g.drawImage(im,0,0,w,h);res(c.toDataURL(type,q))};
      im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

    if(!(raw>0))return setHint('#payHint','Saisissez un montant supérieur à 0.');

      const used=p.payments.filter(x=>x.code===code).reduce((a,x)=>a+x.amount,0);const bal=v.balance-used;
      if(bal<=0)return setHint('#payHint','Ce bon n\'a plus de solde.');
      if(raw>bal||raw>rem){const el=$('#payHint');el.textContent=raw>bal?'Solde du bon : '+money(bal)+'.':'Le montant dépasse le reste à payer.';el.className='hint err';return}
      p.payments.push({m:'voucher',amount:raw,code});
    }else{if(raw>rem){const el=$('#payHint');el.textContent='Le montant dépasse le reste à payer.';el.className='hint err';return}p.payments.push({m:p.method,amount:raw})}

  async payFinish(){
    const t=cartTotals(),p=ui.pay;const oid=ui.orderId;
    if(!t.lines.length||t.total-paidSum(p)>0||ui.busy)return;
    const d=ui.discount;const discLabel=d?(d.points?'fidélité':d.type==='pct'?pctTxt(d.value)+' %':''):'';
    const cl=curClient();const L2=cf('loyalty');const used=d&&d.points?d.points:0;
    const pts=cl&&L2.on?Math.max(0,Math.floor(t.total/100*L2.perEuro)):0;
    await commit((n,prev)=>({n,ts:Date.now(),kind:'sale',refOf:0,by:who(),reason:'',client:cl?cl.name:'',clientId:cl?cl.id:'',pts,ptsUsed:used,
      lines:t.lines.map(l=>({id:l.id,lk:l.lk,name:l.name,price:l.price,qty:l.qty,vat:l.vat,sku:l.sku,buy:l.buy,w:l.w,gift:l.gift?1:undefined})),
      sub:t.sub,disc:t.disc,discLabel,total:t.total,vat:t.vat,payments:p.payments,change:p.payments.reduce((a,x)=>a+(x.change||0),0),prev}),
      async rec=>{
        await adjustStock(rec.lines.filter(l=>!l.gift),-1);
        const gifts=[];for(const l of rec.lines){if(!l.gift)continue;for(let q=0;q<l.qty;q++){const code='CC'+Math.random().toString(36).slice(2,8).toUpperCase();const v={code,balance:l.price,created:rec.ts,from:rec.n,gift:true};try{await Store.set('vouchers',code,v)}catch(e){}S.vouchers[code]=v;gifts.push({code,amount:l.price})}}
        rec.giftCodes=gifts;
        for(const x of rec.payments){if(x.m==='voucher'){const v=S.vouchers[x.code];if(v){const nb=v.balance-x.amount;v.balance=nb;try{await Store.update('vouchers',x.code,{balance:nb})}catch(e){}}}}
        if(cl){const np=Math.max(0,(cl.points||0)-used+pts);cl.points=np;cl.visits=(cl.visits||0)+1;cl.spent=(cl.spent||0)+rec.total;
          try{await Store.update('customers',cl.id,{points:np,visits:cl.visits,spent:cl.spent,last:rec.ts})}catch(e){}}
        if(oid){try{await Store.update('orders',oid,{status:'done',saleN:rec.n,doneAt:rec.ts});if(S.orders[oid])S.orders[oid].status='done'}catch(e){}}
        ui.orderId=null;ui.cart=[];ui.discount=null;ui.pay=null;ui.client=null;ui.done=rec;
        const mode=cf('ticket.auto');
        if(mode==='show'){ui.view=rec.n;ui.sheet='ticket'}
        else if(mode==='never'){ui.sheet=null;ui.done=null;toast(rec.change>0?'Vente enregistrée · monnaie à rendre '+money(rec.change):'Vente enregistrée N° '+pad6(rec.n))}
        else ui.sheet='done';
        renderApp();renderSheet();
      });
    renderSheet();
  },

  async saveProduct(){

    const weighed=$('#pWeighed').checked,fav=$('#pFav').checked;

    const rraw=$('#pRecv').value.trim();const recv=rraw===''?0:parseInt(rraw,10);
    const braw=$('#pBuy').value.trim();const buy=braw===''?null:parseCents(braw);
    const alert=parseInt($('#pAlert').value,10);
    if(!name)return setHint('#pErr','Indiquez le nom du produit.');
    if(!(price>=0))return setHint('#pErr','Indiquez un prix valide, par exemple 12,50.');
    if(stock!==null&&!(stock>=0))return setHint('#pErr','Le stock doit être un nombre entier positif.');
    if(!(recv>=0))return setHint('#pErr','La quantité reçue doit être un nombre entier positif.');

    const old=ui.editing?S.products[ui.editing]:null;const id=old?old.id:uid();

  async closeZ(){

      t.movesIn=mv.filter(m=>m.type==='in').reduce((a,m)=>a+m.amount,0);t.movesOut=mv.filter(m=>m.type==='out').reduce((a,m)=>a+m.amount,0);

      const z={n,ts:Date.now(),fromN:open[0].n,toN:open[open.length-1].n,t,float:flt,counted,prev,cumul};

function obRead(){
  const o=ui.ob;if(!o)return;
  if(o.step===1&&$('#obFirst')){o.first=$('#obFirst').value.trim();o.pin=$('#obPin').value.trim();o.pin2=$('#obPin2').value.trim()}
  if(o.step===2&&$('#sname'))o.shop=readShopForm('s');
  if(document.querySelector('[data-obk]')){o.picks={};document.querySelectorAll('[data-obk]').forEach(i=>{if(i.checked)o.picks[i.dataset.obk]=1});

function typeCards(o){
  return`<div class="tcards">${Object.keys(TYPES).map(k=>`<button class="tcard" data-a="obType" data-v="${k}" aria-pressed="${o.type===k}">${illu(TYPES[k].illus,'')}<span class="tn">${esc(TYPES[k].label)}</span><span class="td">${esc(TYPES[k].desc)}</span></button>`).join('')}</div>`;
}
function catHtml(o){
  const T=TYPES[o.type];if(!T||!T.list.length)return`<div class="empty">${illu('accueil','')}<b>Catalogue vide</b><span>Vous ajouterez vos produits un par un ou par import, depuis l'onglet Produits.</span></div>`;
  if(!o.picks){o.picks={};T.list.forEach((x,i)=>o.picks[i]=1)}
  const groups=[];T.list.forEach((x,i)=>{let g=groups.find(y=>y.c===x.cat);if(!g){g={c:x.cat,it:[]};groups.push(g)}g.it.push([x,i])});
  return groups.map(g=>`<div class="catgrp"><h3>${esc(g.c)}</h3>${g.it.map(([x,i])=>`<label class="crow"><input type="checkbox" data-obk="${i}"${o.picks[i]?' checked':''}><span class="cico">${ic(x.icon,20)}</span><span class="cnm">${esc(x.name)}</span><input class="cpr" data-obp="${i}" inputmode="decimal" autocomplete="off" value="${esc(o.prices[i]!=null?o.prices[i]:x.price)}" aria-label="Prix de ${esc(x.name)}"><span class="eur">€</span></label>`).join('')}</div>`).join('');

function genRecovery(){const a=new Uint8Array(16);crypto.getRandomValues(a);const c=[...a].map(x=>RALPH[x%RALPH.length]).join('');return c.replace(/(.{4})(?=.)/g,'$1-')}
const recNorm=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const recHash=(id,c)=>pinHash('rec-'+id,recNorm(c));

}

function initStandalone(){
  /* Hors Claude : téléchargements par le navigateur + base Supabase partagée */
  downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}};
  const cfg=window.SUPABASE_CONFIG;if(!cfg||!window.supabase)return;
  try{
    const sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false}});
    const J=d=>JSON.parse(JSON.stringify(d));
    const cache={},subs={},chans={};
    const notify=c=>{const m=cache[c]||{};(subs[c]||[]).forEach(s=>s.next({docs:Object.keys(m).map(id=>({id,data:()=>m[id]})),metadata:{fromCache:false}}))};
    const load=async c=>{const r=await sb.from('docs').select('id,data').eq('col',c);if(r.error)throw r.error;cache[c]={};r.data.forEach(x=>{cache[c][x.id]=x.data});notify(c)};
    const watch=c=>{if(chans[c])return;chans[c]=sb.channel('docs-'+c).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+c},p=>{cache[c]=cache[c]||{};if(p.eventType==='DELETE')delete cache[c][p.old.id];else cache[c][p.new.id]=p.new.data;notify(c)}).subscribe(st=>{if(st==='SUBSCRIBED')load(c).catch(()=>{})})};
    const mergeD=(base,d)=>{const o=J(base||{});Object.keys(d).forEach(k=>{const ps=k.split('.');let t=o;for(let i=0;i<ps.length-1;i++){t=t[ps[i]]=(t[ps[i]]&&typeof t[ps[i]]==='object')?t[ps[i]]:{}}t[ps[ps.length-1]]=J({v:d[k]}).v});return o};
    const put=async(c,id,data)=>{const r=await sb.from('docs').upsert({col:c,id,data,updated_at:new Date().toISOString()});if(r.error)throw r.error;(cache[c]=cache[c]||{})[id]=data;notify(c)};
    db={
      ping:async()=>{const r=await sb.from('docs').select('id').limit(1);if(r.error)throw r.error},
      collection:c=>({onSnapshot:(next,err)=>{const s={next,err};(subs[c]=subs[c]||[]).push(s);watch(c);load(c).catch(e=>{if(err)err(e)});return()=>{subs[c]=(subs[c]||[]).filter(x=>x!==s)}}}),
      doc:p=>{const i=p.indexOf('/'),c=p.slice(0,i),id=p.slice(i+1);return{
        set:d=>put(c,id,J(d)),
        update:async d=>{const r=await sb.from('docs').select('data').eq('col',c).eq('id',id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('not-found');await put(c,id,mergeD(r.data.data,d))},
        delete:async()=>{const r=await sb.from('docs').delete().eq('col',c).eq('id',id);if(r.error)throw r.error;if(cache[c])delete cache[c][id];notify(c)},
        acquire:async o=>{const r=await sb.rpc('acquire_lease',{p_col:c,p_id:id,p_holder:o.holder,p_ttl_ms:o.ttlMs});if(r.error)throw r.error;return{acquired:!!r.data}}}}
    };
  }catch(e){db=null}
}

  if(window.supabase)return true;
  for(const u of ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js']){
    try{await new Promise((ok,ko)=>{const t=document.createElement('script');t.src=u;t.onload=ok;t.onerror=ko;document.head.appendChild(t);setTimeout(ko,8000)});if(window.supabase)return true}catch(e){}
  }
  return false;
}
async function start(){
  if(window.claude)document.documentElement.classList.add('hosted');
  renderApp();
  const slow=setTimeout(()=>{if(!allReady()){S.slow=true;renderApp()}},10000);
  try{
    if(window.claude&&window.claude.use){
      db=await window.claude.use('db');
      downloads=await window.claude.use('downloads');
    }
  }catch(e){db=null}
  let dbErr='';
  if(!window.claude){
    if(!(await loadSb()))dbErr='bibliothèque Supabase introuvable (pas de connexion internet ?)';
    else{
      initStandalone();
      if(db&&db.ping){try{await Promise.race([db.ping(),new Promise((_,ko)=>setTimeout(()=>ko(new Error('délai dépassé')),8000))])}catch(e){db=null;dbErr=(e&&e.message)||'erreur inconnue'}}
      else dbErr='configuration Supabase invalide';
    }
  }
  if(!db)lload();applyLook();
  if(dbErr)showBanner('Base de données','Connexion impossible : mode local temporaire','Raison : '+dbErr+'. Les données de cette session restent dans ce navigateur et ne sont pas envoyées à Supabase. Vérifiez internet puis rechargez la page.');
  startSubs();
  const iv=setInterval(()=>{if(allReady()){clearTimeout(slow);clearInterval(iv)}},500);
}
start();
})();
</script>
<script>
/* Plein écran : automatique au premier toucher + bouton (window.caisseFs) */
(function(){
  var de=document.documentElement,done=false,off=false;
  try{off=localStorage.getItem('caisse-fs-off')==='1'}catch(e){}
  function req(){var f=de.requestFullscreen||de.webkitRequestFullscreen;if(!f)return null;
    try{return Promise.resolve(f.call(de,{navigationUI:'hide'}))}catch(e){return Promise.reject(e)}}
  function enter(){
    if(done||off||document.fullscreenElement||document.webkitFullscreenElement)return;
    var p=req();if(!p)return;done=true;p.catch(function(){done=false});
  }
  document.addEventListener('fullscreenchange',function(){
    if(!document.fullscreenElement&&done){off=true;document.removeEventListener('pointerdown',enter,true)}
  });
  document.addEventListener('pointerdown',enter,true);
  /* Bouton : bascule plein écran. Renvoie false si le navigateur ou l'hôte l'interdit. */
  window.caisseFs=async function(){
    try{
      if(document.fullscreenElement||document.webkitFullscreenElement){
        off=true;(document.exitFullscreen||document.webkitExitFullscreen).call(document);return true}
      var p=req();if(!p)return false;await p;done=true;off=false;return true;
    }catch(e){return false}
  };
  /* Bouton flottant sur les écrans sans barre d'en-tête (accès, choix du compte, code PIN) */
  var fb=document.createElement('button');
  fb.type='button';fb.setAttribute('aria-label','Plein écran');fb.textContent='⛶ Plein écran';
  fb.style.cssText='position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));padding:8px 12px;border-radius:999px;border:1px solid var(--line,rgba(128,128,128,.4));background:var(--bg,#fff);color:var(--fg,#111);font:500 13px system-ui,sans-serif;cursor:pointer;display:none';
  fb.addEventListener('click',async function(){
    var ok=await window.caisseFs();
    if(!ok){fb.textContent='Indisponible ici';setTimeout(function(){fb.textContent='⛶ Plein écran'},2500)}
  });
  document.body.appendChild(fb);
  function sync(){
    var fsOn=!!(document.fullscreenElement||document.webkitFullscreenElement);
    fb.style.display=(!fsOn&&!document.querySelector('.tb'))?'block':'none';
  }
  document.addEventListener('fullscreenchange',sync);
  new MutationObserver(sync).observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
  sync();
})();
</script>
